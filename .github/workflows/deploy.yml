name: Deploy Static Site to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::140023372433:role/GitHubActionsS3DeployRole
          aws-region: ap-south-1

      - name: Deploy Static Website to S3
        run : |
          aws s3 sync . s3://github-actions-s3-vivek-20260829 \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --delete